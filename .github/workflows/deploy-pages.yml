name: Deploy Aegis Link PWA

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Run regression tests
        run: node --test

      - name: Prepare deployment files
        run: |
          mkdir _site
          rsync -av \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="_site/" \
            ./ _site/

          BUILD_VERSION="deploy-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"

          sed -i \
            "s/__BUILD_VERSION__/${BUILD_VERSION}/g" \
            _site/service-worker.js

          printf 'window.AEGIS_RUNTIME_VERSION = "%s";\n' \
            "${BUILD_VERSION}" \
            > _site/runtime-version.js

                      sed -i \
            "s/__BUILD_VERSION__/${BUILD_VERSION}/g" \
            _site/index.html

          grep -q "${BUILD_VERSION}" _site/service-worker.js
          grep -q "${BUILD_VERSION}" _site/runtime-version.js
          grep -q "${BUILD_VERSION}" _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload deployment artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Wait for uploaded Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for AegisAttempt in $(seq 1 15); do
            AegisArtifactCount=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$AegisArtifactCount" = 1 ]; then
              echo "Pages artifact metadata verified"
              exit 0
            fi
            if [ "$AegisArtifactCount" -gt 1 ]; then
              echo "AEGIS_STOP: MULTIPLE_PAGES_ARTIFACTS"
              exit 1
            fi
            sleep 2
          done
          echo "AEGIS_STOP: PAGES_ARTIFACT_METADATA_DEADLINE"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
