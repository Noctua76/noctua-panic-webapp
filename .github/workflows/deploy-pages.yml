name: Deploy Aegis Link PWA

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Run regression tests
        run: node --test

      - name: Prepare deployment files
        run: |
          mkdir _site
          rsync -av \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="_site/" \
            ./ _site/

          BUILD_VERSION="deploy-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"

          sed -i \
            "s/__BUILD_VERSION__/${BUILD_VERSION}/g" \
            _site/service-worker.js

          printf 'window.AEGIS_RUNTIME_VERSION = "%s";\n' \
            "${BUILD_VERSION}" \
            > _site/runtime-version.js

                      sed -i \
            "s/__BUILD_VERSION__/${BUILD_VERSION}/g" \
            _site/index.html

          grep -q "${BUILD_VERSION}" _site/service-worker.js
          grep -q "${BUILD_VERSION}" _site/runtime-version.js
          grep -q "${BUILD_VERSION}" _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload deployment artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Wait for uploaded Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for AegisAttempt in $(seq 1 15); do
            AegisArtifactCount=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$AegisArtifactCount" = 1 ]; then
              echo "Pages artifact metadata verified"
              exit 0
            fi
            if [ "$AegisArtifactCount" -gt 1 ]; then
              echo "AEGIS_STOP: MULTIPLE_PAGES_ARTIFACTS"
              exit 1
            fi
            sleep 2
          done
          echo "AEGIS_STOP: PAGES_ARTIFACT_METADATA_DEADLINE"
          exit 1

      - name: Deploy verified Pages artifact through official REST API
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            let stage = 'ARTIFACT';
            try {
              const common = {owner: context.repo.owner, repo: context.repo.repo, request: {timeout: 10000}};
              const result = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts', {...common, run_id: context.runId, per_page: 100});
              const artifacts = result.data.artifacts.filter(a => a.name === 'github-pages' && !a.expired);
              if (artifacts.length !== 1 || !artifacts[0].size_in_bytes || artifacts[0].workflow_run?.head_sha !== context.sha) throw new Error('ARTIFACT_IDENTITY');
              stage = 'OIDC';
              const idToken = await core.getIDToken();
              core.setSecret(idToken);
              stage = 'CREATE';
              const created = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {...common, artifact_id: artifacts[0].id, pages_build_version: context.sha, oidc_token: idToken});
              const deployment = created.data;
              core.setOutput('deployment_id', deployment.id);
              stage = 'STATUS';
              const deadline = Date.now() + 120000;
              while (Date.now() < deadline) {
                const response = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {...common, deployment_id: deployment.id});
                if (response.data.status === 'succeed') {
                  core.setOutput('page_url', deployment.page_url);
                  core.info('PAGES_DEPLOYMENT_SUCCEEDED');
                  return;
                }
                if (['failed','cancelled','errored','deployment_failed'].includes(response.data.status)) throw new Error('DEPLOYMENT_REJECTED');
                await new Promise(resolve => setTimeout(resolve, 2000));
              }
              throw new Error('STATUS_DEADLINE');
            } catch {
              core.setFailed('AEGIS_PAGES_' + stage + '_FAILED');
            }
