<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Aegis Link · Shift Reports</title>
  <style>
    :root{color-scheme:dark;--bg:#03040a;--card:#111522;--card2:#181d2c;--text:#f8fafc;--muted:#9ca3af;--line:rgba(255,255,255,.1);--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--amber:#f59e0b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#202642 0,var(--bg) 58%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.app{width:min(100%,520px);min-height:100vh;margin:auto;padding:16px 14px 34px;display:grid;gap:14px}.card{padding:18px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#0a0d18,var(--card));box-shadow:0 22px 55px rgba(0,0,0,.55)}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}h1,h2,p{margin:0}h1{font-size:27px}.eyebrow{margin-bottom:6px;color:#93c5fd;font-size:11px;font-weight:900;letter-spacing:.14em}.back{color:#bfdbfe;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:12px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.meta div{padding:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:15px}.meta span,label{display:block;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.meta strong{display:block;margin-top:4px;font-size:13px}.banner{display:none;padding:13px;border-radius:16px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4);color:#fde68a;font-size:13px}.banner.show{display:block}.form{display:grid;gap:14px}.field{display:grid;gap:7px}.field select,.field textarea{width:100%;color:var(--text);background:#090c16;border:1px solid var(--line);border-radius:15px;padding:13px;outline:none}.field textarea{min-height:130px;resize:vertical;line-height:1.45}.field select:focus,.field textarea:focus{border-color:#60a5fa}.priority{display:grid;grid-template-columns:1fr 1fr;gap:8px}.priority input{position:absolute;opacity:0}.priority label{cursor:pointer;padding:12px;text-align:center;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03)}.priority input:checked+label{color:#fff;border-color:#60a5fa;background:rgba(59,130,246,.2)}.photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.photo-btn{position:relative;overflow:hidden;text-align:center;padding:12px;border:1px dashed rgba(147,197,253,.5);border-radius:14px;color:#bfdbfe;background:rgba(59,130,246,.08);font-size:12px;font-weight:800}.photo-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}.previews{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.preview{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid var(--line)}.preview img{width:100%;height:100%;object-fit:cover}.preview button{position:absolute;right:4px;top:4px;width:27px;height:27px;border:0;border-radius:50%;background:rgba(0,0,0,.78);color:#fff}.help,.counter{color:var(--muted);font-size:12px}.counter{text-align:right}.submit{border:0;border-radius:999px;padding:14px;color:white;background:linear-gradient(145deg,#2563eb,#60a5fa);font-weight:900;letter-spacing:.06em}.submit:disabled{opacity:.45}.feedback{display:none;padding:12px;border-radius:14px;font-size:13px}.feedback.show{display:block}.feedback.ok{background:rgba(34,197,94,.13);color:#bbf7d0}.feedback.error{background:rgba(239,68,68,.13);color:#fecaca}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-head span{color:var(--muted);font-size:12px}.list{display:grid;gap:9px}.empty{color:var(--muted);text-align:center;padding:20px 8px}.report{padding:13px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.035)}.report-top{display:flex;justify-content:space-between;gap:10px}.report-number{font-weight:900;font-size:13px}.badge{padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900;background:rgba(96,165,250,.14);color:#bfdbfe}.badge.important{background:rgba(245,158,11,.15);color:#fde68a}.report-message{margin-top:9px;font-size:13px;line-height:1.4;white-space:pre-wrap}.report-meta{margin-top:8px;color:var(--muted);font-size:11px}.hidden{display:none!important}
  </style>
</head>
<body>
<main class="app">
  <section class="card">
    <div class="top"><div><div class="eyebrow">OPERATIONAL NOTES</div><h1>Shift Reports</h1></div><a class="back" href="index.html">← Home</a></div>
    <div class="meta"><div><span>Guard</span><strong id="guardName">—</strong></div><div><span>Site</span><strong id="siteName">—</strong></div></div>
  </section>
  <div id="readOnlyBanner" class="banner">Προσωρινή πρόσβαση μόνο για προβολή. Δεν επιτρέπεται η δημιουργία Shift Report.</div>
  <section class="card" id="formCard">
    <form id="reportForm" class="form">
      <h2>New Shift Report</h2>
      <div class="field"><label for="category">Category</label><select id="category" name="category" required><option value="OBSERVATION">Observation</option><option value="FACILITY_EQUIPMENT">Facility / Equipment</option><option value="SECURITY_CONCERN">Security Concern</option><option value="HANDOVER_NOTE">Handover Note</option><option value="OTHER">Other</option></select></div>
      <div class="field"><label>Priority</label><div class="priority"><div><input id="normal" type="radio" name="priority" value="NORMAL" checked><label for="normal">Normal</label></div><div><input id="important" type="radio" name="priority" value="IMPORTANT"><label for="important">Important</label></div></div></div>
      <div class="field"><label for="message">Operational note</label><textarea id="message" maxlength="5000" required placeholder="Καταγράψτε με σαφήνεια την παρατήρηση ή την ενημέρωση βάρδιας."></textarea><div class="counter"><span id="charCount">0</span>/5000</div></div>
      <div class="field"><label>Photos · optional</label><div class="photo-actions"><div class="photo-btn">📷 Take photo<input id="cameraInput" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></div><div class="photo-btn">＋ Choose photos<input id="galleryInput" type="file" accept="image/jpeg,image/png,image/webp" multiple></div></div><div class="help">Up to 5 images. Images are compressed before secure upload.</div><div id="previews" class="previews"></div></div>
      <button id="submitBtn" class="submit" type="submit">Submit Shift Report</button>
      <div id="feedback" class="feedback" role="status"></div>
    </form>
  </section>
  <section class="card"><div class="section-head"><h2>Current Shift</h2><span id="reportCount">0 reports</span></div><div id="reports" class="list"><div class="empty">Loading…</div></div></section>
</main>
<script src="config.js"></script>
<script>
const API_BASE_URL=window.AEGIS_CONFIG.backendBase;
const SESSION_KEY="aegis_guard_session";
const session=(()=>{try{return JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch{return null}})();
const token=localStorage.getItem("guard_session_token")||session?.guard_session_token||"";
if(!session||!token) window.location.replace("index.html");
const readOnly=session?.guard?.access_mode==="read_only";
document.getElementById("guardName").textContent=session?.guard?.full_name||session?.guard?.username||"—";
document.getElementById("siteName").textContent=session?.guard?.site_name||`Site ${session?.guard?.site_id||"—"}`;
document.getElementById("readOnlyBanner").classList.toggle("show",readOnly);
document.getElementById("formCard").classList.toggle("hidden",readOnly);
const message=document.getElementById("message"),charCount=document.getElementById("charCount"),previews=document.getElementById("previews"),feedback=document.getElementById("feedback"),submitBtn=document.getElementById("submitBtn");
let selectedFiles=[];
message.addEventListener("input",()=>charCount.textContent=message.value.length);
function showFeedback(text,type){feedback.textContent=text;feedback.className=`feedback show ${type}`}
function renderPreviews(){previews.innerHTML="";selectedFiles.forEach((file,index)=>{const box=document.createElement("div");box.className="preview";const img=document.createElement("img");img.src=URL.createObjectURL(file);img.onload=()=>URL.revokeObjectURL(img.src);const remove=document.createElement("button");remove.type="button";remove.textContent="×";remove.onclick=()=>{selectedFiles.splice(index,1);renderPreviews()};box.append(img,remove);previews.append(box)})}
async function compressImage(file){const bitmap=await createImageBitmap(file);const max=1800,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement("canvas");canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const type=file.type==="image/png"?"image/png":"image/jpeg";const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error("Image compression failed")),type,.84));return new File([blob],file.name.replace(/\.[^.]+$/,type==="image/png"?".png":".jpg"),{type})}
async function addFiles(files){for(const file of files){if(selectedFiles.length>=5){showFeedback("Μπορείτε να προσθέσετε έως 5 φωτογραφίες.","error");break}if(!["image/jpeg","image/png","image/webp"].includes(file.type)){showFeedback("Επιτρέπονται μόνο JPEG, PNG και WEBP εικόνες.","error");continue}try{const compressed=await compressImage(file);if(compressed.size>10*1024*1024)throw new Error("Η φωτογραφία παραμένει μεγαλύτερη από 10 MB.");selectedFiles.push(compressed)}catch(error){showFeedback(error.message||"Η επεξεργασία φωτογραφίας απέτυχε.","error")}}renderPreviews()}
document.getElementById("cameraInput").addEventListener("change",event=>{addFiles(event.target.files);event.target.value=""});
document.getElementById("galleryInput").addEventListener("change",event=>{addFiles(event.target.files);event.target.value=""});
async function api(path,options={}){const response=await fetch(`${API_BASE_URL}${path}`,{...options,headers:{Authorization:`Bearer ${token}`,...options.headers}});const data=await response.json().catch(()=>({}));if(response.status===401||data.code==="TEMPORARY_ACCESS_EXPIRED"){localStorage.removeItem(SESSION_KEY);localStorage.removeItem("guard_session_token");window.location.replace("index.html");throw new Error("Session expired")}if(!response.ok)throw new Error(data.message||"Request failed");return data}
function formatDate(value){return new Intl.DateTimeFormat("el-GR",{dateStyle:"short",timeStyle:"short"}).format(new Date(value))}
function renderReports(items){const list=document.getElementById("reports");document.getElementById("reportCount").textContent=`${items.length} report${items.length===1?"":"s"}`;if(!items.length){list.innerHTML='<div class="empty">No Shift Reports in this shift.</div>';return}list.innerHTML="";items.forEach(item=>{const card=document.createElement("article");card.className="report";const top=document.createElement("div");top.className="report-top";const number=document.createElement("div");number.className="report-number";number.textContent=item.report_number;const badge=document.createElement("span");badge.className=`badge ${item.priority==="IMPORTANT"?"important":""}`;badge.textContent=item.priority;top.append(number,badge);const body=document.createElement("div");body.className="report-message";body.textContent=item.message;const meta=document.createElement("div");meta.className="report-meta";meta.textContent=`${item.category.replaceAll("_"," ")} · ${formatDate(item.created_at)} · ${item.attachment_count||0} photo(s)`;card.append(top,body,meta);list.append(card)})}
async function loadReports(){try{const data=await api("/guard/shift-reports/current-shift");renderReports(data.reports||[])}catch(error){document.getElementById("reports").innerHTML=`<div class="empty">${error.message}</div>`}}
document.getElementById("reportForm").addEventListener("submit",async event=>{event.preventDefault();if(readOnly)return;submitBtn.disabled=true;showFeedback("Uploading secure Shift Report…","ok");try{const form=new FormData();form.append("category",document.getElementById("category").value);form.append("priority",document.querySelector('input[name="priority"]:checked').value);form.append("message",message.value);selectedFiles.forEach(file=>form.append("attachments",file,file.name));const data=await api("/guard/shift-reports",{method:"POST",body:form});event.target.reset();message.value="";charCount.textContent="0";selectedFiles=[];renderPreviews();showFeedback(`Το ${data.report.report_number} καταχωρίστηκε επιτυχώς.`,"ok");await loadReports()}catch(error){showFeedback(error.message,"error")}finally{submitBtn.disabled=false}});
loadReports();
</script>
</body>
</html>
